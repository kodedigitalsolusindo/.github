<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Alur kerja: Analisis Kebutuhan, Desain dan Prototipe, Pengembangan dan Pengujian, Rilis dan Dukungan">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
  </defs>
  <style>
    .f{font-family:'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif}
    .n{font-size:22px;font-weight:800;fill:#fff}
    .t{font-size:18px;font-weight:700;fill:#fff}
    .d{font-size:14px;fill:#a5b4cc}
    .dash{stroke-dasharray:6 8;animation:mv 1.2s linear infinite}
    @keyframes mv{to{stroke-dashoffset:-14}}
  </style>
  <rect width="1200" height="230" rx="20" fill="#0b1630"/>
  <path d="M150 74H1050" stroke="url(#line)" stroke-width="3" class="dash" fill="none"/>

  <g text-anchor="middle" class="f">
    <g transform="translate(150,0)">
      <circle cx="0" cy="74" r="34" fill="#0b1630" stroke="url(#brand)" stroke-width="3"/><circle cx="0" cy="74" r="26" fill="url(#brand)"/>
      <text y="82" class="n">1</text>
      <text y="142" class="t">Analisis Kebutuhan</text>
      <text class="d"><tspan x="0" y="168">Diskusi tujuan, fitur,</tspan><tspan x="0" y="188">anggaran, dan jadwal</tspan></text>
    </g>
    <g transform="translate(450,0)">
      <circle cx="0" cy="74" r="34" fill="#0b1630" stroke="url(#brand)" stroke-width="3"/><circle cx="0" cy="74" r="26" fill="url(#brand)"/>
      <text y="82" class="n">2</text>
      <text y="142" class="t">Desain &amp; Prototipe</text>
      <text class="d"><tspan x="0" y="168">Wireframe dan prototipe</tspan><tspan x="0" y="188">yang bisa dicoba</tspan></text>
    </g>
    <g transform="translate(750,0)">
      <circle cx="0" cy="74" r="34" fill="#0b1630" stroke="url(#brand)" stroke-width="3"/><circle cx="0" cy="74" r="26" fill="url(#brand)"/>
      <text y="82" class="n">3</text>
      <text y="142" class="t">Pengembangan &amp; Pengujian</text>
      <text class="d"><tspan x="0" y="168">Sprint bertahap dengan</tspan><tspan x="0" y="188">QA di setiap rilis</tspan></text>
    </g>
    <g transform="translate(1050,0)">
      <circle cx="0" cy="74" r="34" fill="#0b1630" stroke="url(#brand)" stroke-width="3"/><circle cx="0" cy="74" r="26" fill="url(#brand)"/>
      <text y="82" class="n">4</text>
      <text y="142" class="t">Rilis &amp; Dukungan</text>
      <text class="d"><tspan x="0" y="168">Publikasi ke store dan</tspan><tspan x="0" y="188">pemeliharaan berkala</tspan></text>
    </g>
  </g>
</svg>
