<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="PT Kode Digital Solusindo — Software House Medan, Indonesia">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1630"/><stop offset="1" stop-color="#0f1d3a"/></linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <radialGradient id="glow1" cx="0.85" cy="0.15" r="0.6"><stop offset="0" stop-color="#06b6d4" stop-opacity=".35"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="0.95" r="0.55"><stop offset="0" stop-color="#2563eb" stop-opacity=".35"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1e3a6b" stroke-width="1" opacity=".45"/></pattern>
    <clipPath id="clip"><rect width="1200" height="380" rx="20"/></clipPath>
  </defs>
  <style>
    .f{font-family:'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif}
    .m{font-family:'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace}
    .cur{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .float{animation:fl 6s ease-in-out infinite}
    @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>
    <rect width="1200" height="380" fill="url(#glow1)"/>
    <rect width="1200" height="380" fill="url(#glow2)"/>
    <rect x="0" y="0" width="1200" height="4" fill="url(#brand)"/>

    <!-- Logo -->
    <svg x="64" y="64" width="88" height="88" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="16" fill="url(#brand)"/>
      <path d="M24 20 13 32l11 12" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M40 20l11 12-11 12" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/>
      <path d="M36 17 28 47" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
    </svg>
    <text x="172" y="100" class="f" font-size="15" font-weight="600" fill="#93c5fd" letter-spacing="3">SOFTWARE HOUSE · MEDAN, INDONESIA</text>
    <text x="172" y="140" class="f" font-size="34" font-weight="800" fill="#ffffff">PT Kode Digital Solusindo</text>

    <text x="64" y="210" class="f" font-size="27" font-weight="700" fill="url(#txt)">Dari ide sampai rilis.</text>
    <text x="64" y="244" class="f" font-size="17" fill="#cbd5e1">Aplikasi mobile, aplikasi web, dan sistem backend</text>
    <text x="64" y="268" class="f" font-size="17" fill="#cbd5e1">yang aman, cepat, dan siap tumbuh bersama bisnis Anda.</text>

    <!-- chips -->
    <g class="f" font-size="13" font-weight="600" fill="#e0f2fe">
      <rect x="64" y="300" width="84" height="30" rx="15" fill="#1d4ed8" fill-opacity=".25" stroke="#3b82f6" stroke-opacity=".6"/><text x="106" y="320" text-anchor="middle">Android</text>
      <rect x="156" y="300" width="56" height="30" rx="15" fill="#1d4ed8" fill-opacity=".25" stroke="#3b82f6" stroke-opacity=".6"/><text x="184" y="320" text-anchor="middle">iOS</text>
      <rect x="220" y="300" width="104" height="30" rx="15" fill="#1d4ed8" fill-opacity=".25" stroke="#3b82f6" stroke-opacity=".6"/><text x="272" y="320" text-anchor="middle">HarmonyOS</text>
      <rect x="332" y="300" width="64" height="30" rx="15" fill="#0891b2" fill-opacity=".25" stroke="#06b6d4" stroke-opacity=".6"/><text x="364" y="320" text-anchor="middle">Web</text>
      <rect x="404" y="300" width="128" height="30" rx="15" fill="#0891b2" fill-opacity=".25" stroke="#06b6d4" stroke-opacity=".6"/><text x="468" y="320" text-anchor="middle">Backend &amp; API</text>
      <rect x="540" y="300" width="80" height="30" rx="15" fill="#0891b2" fill-opacity=".25" stroke="#06b6d4" stroke-opacity=".6"/><text x="580" y="320" text-anchor="middle">UI/UX</text>
    </g>

    <!-- code window -->
    <g class="float">
      <rect x="700" y="62" width="440" height="260" rx="14" fill="#0a1226" stroke="#1e3a6b"/>
      <rect x="700" y="62" width="440" height="38" rx="14" fill="#111d3b"/>
      <rect x="700" y="86" width="440" height="14" fill="#111d3b"/>
      <circle cx="724" cy="81" r="6" fill="#ef4444"/><circle cx="744" cy="81" r="6" fill="#f59e0b"/><circle cx="764" cy="81" r="6" fill="#22c55e"/>
      <text x="920" y="86" class="m" font-size="13" fill="#64748b" text-anchor="middle">project.ts</text>
      <g class="m" font-size="15">
        <text x="724" y="132"><tspan fill="#c084fc">const</tspan><tspan fill="#e2e8f0"> project </tspan><tspan fill="#94a3b8">= {</tspan></text>
        <text x="744" y="160"><tspan fill="#7dd3fc">client</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#86efac">"Bisnis Anda"</tspan><tspan fill="#94a3b8">,</tspan></text>
        <text x="744" y="188"><tspan fill="#7dd3fc">platform</tspan><tspan fill="#94a3b8">: [</tspan><tspan fill="#86efac">"android"</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#86efac">"ios"</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#86efac">"web"</tspan><tspan fill="#94a3b8">],</tspan></text>
        <text x="744" y="216"><tspan fill="#7dd3fc">secure</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#fbbf24">true</tspan><tspan fill="#94a3b8">,</tspan></text>
        <text x="744" y="244"><tspan fill="#7dd3fc">support</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#86efac">"setelah rilis"</tspan><tspan fill="#94a3b8">,</tspan></text>
        <text x="724" y="272"><tspan fill="#94a3b8">};</tspan></text>
        <text x="724" y="300"><tspan fill="#60a5fa">await</tspan><tspan fill="#e2e8f0"> kodeSolusindo.</tspan><tspan fill="#22d3ee">build</tspan><tspan fill="#94a3b8">(project);</tspan><tspan class="cur" fill="#22d3ee">▍</tspan></text>
      </g>
    </g>
  </g>
</svg>
